name: Send event reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two overlapping schedule ticks never race to commit/push
# automation/notified-state.json at the same time.
concurrency:
  group: event-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Send due reminders
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          REMINDER_EMAIL_TO: ${{ secrets.REMINDER_EMAIL_TO }}
        run: npm run send-reminders

      - name: Commit updated notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/notified-state.json
          git diff --cached --quiet || git commit -m "chore: état des rappels envoyés"
          git push
