<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Frise chronologique jour/heure pour vos objectifs et rendez-vous du jour.">
<meta name="theme-color" content="#009FE3">
<title>Mémo Temps — Frise du jour</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/widget.css">
</head>
<body>

  <main class="mt-page">
    <div id="mt-widget-root"></div>
  </main>

  <script src="js/widget.js"></script>
  <script src="js/outlook.js"></script>
  <script src="js/flipclock.js"></script>
  <script>
    window.mtWidget = new MemoTempsWidget(document.getElementById('mt-widget-root'));
    MemoTempsOutlook.attach(window.mtWidget);
    MemoTempsFlipClock.mount(document.querySelector('.mt-header'));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
